name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows derleme + test
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derle
        run: dotnet build PcCleaner.sln -c Release

      - name: Testleri çalıştır (gerçek Windows)
        run: dotnet test PcCleaner.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Portable EXE üret
        run: dotnet publish src/PcCleaner.App/PcCleaner.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:DebugType=none -o artifacts/portable

      - name: Açılış testi (GUI) + ekran görüntüsü
        shell: pwsh
        run: ./.github/scripts/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PCCleaner-portable
          path: artifacts/portable/PCCleaner.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
